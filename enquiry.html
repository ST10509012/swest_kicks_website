<!DOCTYPE type html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWEST KICKS | Product Enquiry</title>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Product & Stock Enquiry</h1>
    </header>

    <!-- Global Navigation -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="enquiry.html">Enquiry</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main>
        <section>
            <h2>Looking for a specific sneaker or size?</h2>
            <p>Fill out the form below to enquire about specific stock, rare pairs, or custom orders.</p>

            <!-- Customer Enquiry Form -->
            <form action="#" method="post">
                <p>
                    <label for="fullname">Full Name:</label><br>
                    <input type="text" id="fullname" name="fullname" required>
                </p>
                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="sneaker">Sneaker Model Requested:</label><br>
                    <input type="text" id="sneaker" name="sneaker" required>
                </p>
                <p>
                    <label for="size">UK Shoe Size:</label><br>
                    <input type="number" id="size" name="size" min="3" max="14" required>
                </p>
                <p>
                    <label for="message">Additional Details / Notes:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40"></textarea>
                </p>
                <p>
                    <button type="submit">Submit Enquiry</button>
                </p>
            </form>
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 SWEST KICKS. All Rights Reserved.</p>
    </footer>

</body>
</html>
